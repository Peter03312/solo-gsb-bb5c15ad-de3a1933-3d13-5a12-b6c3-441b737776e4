{% extends "base.html" %}
{% block title %}回放 · {{ unit.code }}{% endblock %}
{% block content %}
<p class="muted"><a href="{{ url_for('main.unit_detail', unit_id=unit.id) }}">← 返回 {{ unit.code }} 层位图</a></p>
<h1>探方 {{ unit.code }} · 层位演变回放</h1>

{% if frames %}
<div class="card">
  <div class="replay-controls">
    <button id="btn-first" type="button" class="ghost">⏮</button>
    <button id="btn-prev" type="button" class="ghost">◀ 上一步</button>
    <button id="btn-play" type="button">▶ 播放</button>
    <button id="btn-next" type="button" class="ghost">下一步 ▶</button>
    <input id="seek" type="range" min="0" max="{{ frames|length - 1 }}" value="0"
           step="1" aria-label="进度">
    <span class="muted"><span id="pos">1</span> / {{ frames|length }}</span>
  </div>
  <p id="event-desc" style="margin:.8rem 0 .2rem"></p>
  <p class="muted" id="event-time" style="margin:0 0 .6rem"></p>
  <div id="conflict-banner" class="flash conflict" hidden></div>
  <p class="muted" id="counts"></p>
  <div id="stage" style="overflow-x:auto"></div>
</div>
<script id="frames-data" type="application/json">{{ frames_json|safe }}</script>
<script>
(function () {
  const frames = JSON.parse(document.getElementById('frames-data').textContent);
  const stage = document.getElementById('stage');
  const seek = document.getElementById('seek');
  const btnPlay = document.getElementById('btn-play');
  let index = 0, timer = null;

  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, text) {
    const node = document.createElementNS(NS, tag);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (text != null) node.textContent = text;
    return node;
  }
  function html(tag, attrs, text) {
    const node = document.createElement(tag);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (text != null) node.textContent = text;
    return node;
  }

  function draw(layout) {
    stage.innerHTML = '';
    const svg = el('svg', {
      class: 'graph', viewBox: `0 0 ${layout.width} ${layout.height}`,
      width: layout.width, height: layout.height, role: 'img',
    });
    const defs = el('defs', {});
    const mk = (id, color) => {
      const m = el('marker', {id, markerWidth: 10, markerHeight: 10,
        refX: 8, refY: 3, orient: 'auto', markerUnits: 'strokeWidth'});
      m.appendChild(el('path', {d: 'M0,0 L8,3 L0,6 Z', fill: color}));
      return m;
    };
    defs.appendChild(mk('arrow', '#6d4520'));
    defs.appendChild(mk('arrow-hl', '#b3392e'));
    svg.appendChild(defs);

    layout.edges.forEach(function (e) {
      svg.appendChild(el('line', {
        class: 'edge' + (e.highlight ? ' highlight' : ''),
        x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2,
        'marker-end': 'url(#' + (e.highlight ? 'arrow-hl' : 'arrow') + ')',
      }));
    });
    layout.nodes.forEach(function (n) {
      const g = el('g', {
        class: `node ${n.status}${n.highlight ? ' highlight' : ''}`,
        transform: `translate(${n.x}, ${n.y})`,
      });
      g.appendChild(el('rect', {width: n.w, height: n.h, rx: 7}));
      g.appendChild(el('text', {class: 'code', x: 10, y: 22}, n.code));
      g.appendChild(el('text', {class: 'meta', x: 10, y: 40},
                       '发掘顺序 ' + n.excavation_order));
      g.appendChild(el('text', {class: 'meta', x: 10, y: 56},
                       (n.status === 'closed' ? '已关闭' : '开放中') +
                       ' · 遗物 ' + n.artifact_count + ' 批'));
      svg.appendChild(g);
    });
    stage.appendChild(svg);
  }

  function render(i) {
    index = Math.max(0, Math.min(frames.length - 1, i));
    const f = frames[index];
    seek.value = index;
    document.getElementById('pos').textContent = index + 1;
    document.getElementById('event-desc').textContent =
      `[${f.type_label}] ${f.desc}`;
    document.getElementById('event-time').textContent =
      '事件时间：' + f.ts.replace('T', ' ').replace(/\.\d+.*$/, ' UTC');
    document.getElementById('counts').textContent =
      `当前状态：${f.stratum_count} 个层位 · ${f.relation_count} 条覆盖关系 · ${f.batch_count} 批遗物`;
    const banner = document.getElementById('conflict-banner');
    if (f.notice) {
      banner.hidden = false;
      banner.textContent = '⚠ ' + f.notice.desc +
        (f.notice.conflict_path ? ' 冲突路径：' + f.notice.conflict_path : '') +
        '（已保留为草稿，未改动层位图）';
    } else {
      banner.hidden = true;
    }
    draw(f.layout);
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; btnPlay.textContent = '▶ 播放'; }
  }
  document.getElementById('btn-first').onclick = () => { stop(); render(0); };
  document.getElementById('btn-prev').onclick = () => { stop(); render(index - 1); };
  document.getElementById('btn-next').onclick = () => { stop(); render(index + 1); };
  seek.oninput = () => { stop(); render(Number(seek.value)); };
  btnPlay.onclick = () => {
    if (timer) { stop(); return; }
    btnPlay.textContent = '⏸ 暂停';
    timer = setInterval(() => {
      if (index >= frames.length - 1) { stop(); render(frames.length - 1); return; }
      render(index + 1);
    }, 900);
  };
  render(0);
})();
</script>
{% else %}
<p class="muted">该探方还没有任何事件，暂无可回放内容。</p>
{% endif %}
{% endblock %}
