{# 层位图 SVG 渲染宏：输入 layered_layout() 的结果 #}
{% macro render_graph(graph, id_prefix='g') %}
{% if graph.nodes %}
<svg class="graph" viewBox="0 0 {{ graph.width }} {{ graph.height }}"
     width="{{ graph.width }}" height="{{ graph.height }}" role="img"
     aria-label="层位覆盖关系图">
  <defs>
    <marker id="{{ id_prefix }}-arrow" markerWidth="10" markerHeight="10"
            refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6d4520"></path>
    </marker>
    <marker id="{{ id_prefix }}-arrow-hl" markerWidth="10" markerHeight="10"
            refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b3392e"></path>
    </marker>
  </defs>
  {% for e in graph.edges %}
  <line class="edge {{ 'highlight' if e.highlight }}"
        x1="{{ e.x1 }}" y1="{{ e.y1 }}" x2="{{ e.x2 }}" y2="{{ e.y2 }}"
        marker-end="url(#{{ id_prefix }}-arrow{{ '-hl' if e.highlight else '' }})"></line>
  {% endfor %}
  {% for n in graph.nodes %}
  <g class="node {{ n.status }} {{ 'highlight' if n.highlight }}"
     transform="translate({{ n.x }}, {{ n.y }})">
    <rect width="{{ n.w }}" height="{{ n.h }}" rx="7"></rect>
    <text class="code" x="10" y="22">{{ n.code }}</text>
    <text class="meta" x="10" y="40">发掘顺序 {{ n.excavation_order }}</text>
    <text class="meta" x="10" y="56">
      {{ '已关闭' if n.status == 'closed' else '开放中' }} · 遗物 {{ n.artifact_count }} 批
    </text>
  </g>
  {% endfor %}
</svg>
{% else %}
<p class="muted">该探方尚未登记层位，暂无层位图。</p>
{% endif %}
{% endmacro %}
